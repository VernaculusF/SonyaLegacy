[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonya-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sonya*", "sonya_runtime*", "sonya_shared*"]

[tool.pytest.ini_options]
pythonpath = ["src", "packages/tg-bridge/src"]
asyncio_mode = "auto"
