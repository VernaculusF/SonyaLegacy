<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Atrium — Room (Voice Mode)</title>
<style>
  :root {
    --bg-deep: #0e0f12;
    --bg-warm: #16181c;
    --bg-elev: #1f2228;
    --ink-1: #e8eaed;
    --ink-2: #a8acb3;
    --ink-3: #5c6068;
    --acc-her: #c9cdd4;
    --acc-her-eyes: #8aa3b8;
    --acc-him: #b8895c;
    --acc-mind: #d4d8de;
    --acc-warn: #c87864;
    --hairline: #2a2d33;
    --font-ui: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #050608;
    color: var(--ink-1);
    font-family: var(--font-ui);
    overflow: hidden;
  }
  .room {
    display: grid;
    grid-template-rows: 50px 1fr 220px 60px;
    height: 100vh;
    background: linear-gradient(180deg, #0a0c10 0%, #14161a 50%, #16181c 100%);
    position: relative;
  }

  /* Header */
  .room-header {
    display: flex;
    align-items: center;
    padding: 0 22px;
    font-size: 11px;
    color: var(--ink-2);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: rgba(14, 15, 18, 0.4);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
    z-index: 10;
  }
  .room-header .logo {
    color: var(--acc-her);
    letter-spacing: 0.18em;
  }
  .room-header .room-label {
    margin-left: 18px;
    color: var(--ink-3);
    font-style: italic;
    text-transform: none;
    letter-spacing: 0.04em;
  }
  .room-header .room-label .live-dot {
    color: var(--acc-her-eyes);
    margin-right: 6px;
    animation: livepulse 2s infinite;
  }
  @keyframes livepulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }
  .room-header .spacer { flex: 1; }
  .room-header .exit {
    color: var(--ink-2);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 10px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    transition: all 200ms;
  }
  .room-header .exit:hover {
    color: var(--ink-1);
    border-color: var(--acc-her);
  }

  /* Scene */
  .scene {
    position: relative;
    overflow: hidden;
  }

  /* Window with moon */
  .window {
    position: absolute;
    top: 50px;
    right: 80px;
    width: 240px;
    height: 320px;
    background: linear-gradient(180deg, #1a2030 0%, #0a0c14 100%);
    border: 1px solid var(--hairline);
    box-shadow:
      inset 0 0 60px rgba(138, 163, 184, 0.04),
      0 0 100px rgba(138, 163, 184, 0.04);
  }
  .window-cross {
    position: absolute;
    inset: 0;
  }
  .window-cross::before, .window-cross::after {
    content: "";
    position: absolute;
    background: rgba(42, 45, 51, 0.6);
  }
  .window-cross::before {
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    transform: translateX(-50%);
  }
  .window-cross::after {
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    transform: translateY(-50%);
  }
  .moon {
    position: absolute;
    top: 60px;
    right: 130px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #e8eaed, #a8acb3);
    box-shadow: 0 0 40px rgba(232, 234, 237, 0.25);
    z-index: 2;
  }

  /* Floor and bed */
  .floor {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 280px;
    background: linear-gradient(180deg, transparent 0%, rgba(5, 6, 8, 0.6) 100%);
  }
  .bed {
    position: absolute;
    bottom: 80px;
    left: 80px;
    width: 280px;
    height: 90px;
    background: #1c1d20;
    border-radius: 4px;
    box-shadow: 0 -8px 0 #2a2d33, 0 6px 20px rgba(0,0,0,0.4);
  }
  .pillow {
    position: absolute;
    bottom: 134px;
    left: 96px;
    width: 60px;
    height: 32px;
    background: #2a2d33;
    border-radius: 4px;
  }

  /* Her — placed on edge of bed */
  .her {
    position: absolute;
    bottom: 100px;
    left: 200px;
    width: 220px;
    height: 320px;
    z-index: 5;
  }
  .her svg { width: 100%; height: 100%; }

  /* Her TTS active glow halo */
  .her.speaking {
    filter: drop-shadow(0 0 18px rgba(201, 205, 212, 0.25));
  }

  /* Live subtitle */
  .subtitle-area {
    position: absolute;
    bottom: 240px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    max-width: 560px;
    text-align: center;
    pointer-events: none;
  }
  .subtitle {
    font-size: 17px;
    color: var(--ink-1);
    line-height: 1.5;
    margin-bottom: 8px;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
  .subtitle.spoken { opacity: 0.4; font-size: 14px; }
  .subtitle.interrupted {
    color: var(--ink-2);
    text-decoration: line-through;
    text-decoration-color: var(--acc-warn);
    text-decoration-thickness: 1px;
  }
  .subtitle.her-talking::before {
    content: "— ";
    color: var(--acc-her);
  }
  .subtitle.him-talking::before {
    content: "— ";
    color: var(--acc-him);
  }

  /* Voice activity bottom panel */
  .voice-panel {
    background: rgba(14, 15, 18, 0.85);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--hairline);
    padding: 18px 32px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 32px;
    align-items: stretch;
  }

  .speaker-row {
    display: grid;
    grid-template-columns: 80px 1fr;
    gap: 14px;
    align-items: center;
  }
  .speaker-row .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--ink-3);
    text-align: right;
  }
  .speaker-row.her .label { color: var(--acc-her); }
  .speaker-row.him .label { color: var(--acc-him); }

  /* Waveform — animated bars */
  .wave {
    display: flex;
    gap: 2px;
    align-items: center;
    height: 32px;
  }
  .wave .bar {
    flex: 1;
    background: var(--ink-3);
    transition: background 200ms, height 80ms;
    border-radius: 1px;
    transform: skewX(-8deg);
  }
  .speaker-row.her .wave .bar { background: var(--acc-her); }
  .speaker-row.him .wave .bar { background: var(--acc-him); }
  .speaker-row.idle .wave .bar { background: var(--ink-3); opacity: 0.3; }

  /* Status row beneath both speakers */
  .voice-status {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--hairline);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.06em;
  }
  .voice-status .budget {
    font-family: var(--font-mono);
    color: var(--ink-2);
  }
  .voice-status .budget .val { color: var(--ink-1); }
  .voice-status .controls {
    display: flex;
    gap: 16px;
  }
  .voice-status .ctl {
    cursor: pointer;
    color: var(--ink-2);
    padding: 3px 8px;
    border: 1px solid transparent;
    border-radius: 3px;
    transition: all 150ms;
  }
  .voice-status .ctl:hover {
    color: var(--ink-1);
    border-color: var(--acc-her-eyes);
  }
  .voice-status .ctl.warn:hover { border-color: var(--acc-warn); color: var(--acc-warn); }

  /* Bottom hint bar */
  .hint-bar {
    background: var(--bg-warm);
    border-top: 1px solid var(--hairline);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 10px;
    color: var(--ink-3);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .hint {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hint .key {
    background: var(--bg-elev);
    border: 1px solid var(--hairline);
    color: var(--ink-2);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0;
  }

  /* Interrupt overlay (briefly shown when one cuts the other) */
  .interrupt-flash {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(200, 120, 100, 0.15);
    border: 1px solid var(--acc-warn);
    color: var(--acc-warn);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 250ms;
    pointer-events: none;
    z-index: 50;
  }
  .interrupt-flash.show {
    opacity: 1;
  }

  /* Scenario selector */
  .scenarios {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 100;
    background: rgba(20, 22, 28, 0.95);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 11px;
  }
  .scenarios .label {
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 10px;
    margin-bottom: 4px;
  }
  .scenarios button {
    background: transparent;
    border: 1px solid var(--hairline);
    color: var(--ink-2);
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 0.04em;
    text-align: left;
  }
  .scenarios button:hover { color: var(--ink-1); border-color: var(--acc-her-eyes); }
  .scenarios button.active {
    color: var(--ink-1);
    border-color: var(--acc-her);
    background: rgba(201, 205, 212, 0.05);
  }
</style>
</head>
<body>

<div class="scenarios">
  <div class="label">demo scenarios</div>
  <button onclick="scenario('idle')" class="active">silence</button>
  <button onclick="scenario('her_speaking')">she speaks</button>
  <button onclick="scenario('him_speaking')">he speaks</button>
  <button onclick="scenario('interrupt')">interrupt!</button>
  <button onclick="scenario('tap_stop')">tap-stop</button>
</div>

<div class="room">

  <div class="room-header">
    <span class="logo">◐ ATRIUM</span>
    <span class="room-label"><span class="live-dot">●</span>в комнате · она у окна</span>
    <span class="spacer"></span>
    <span class="exit" onclick="alert('exit room → text chat')">⏏ выйти</span>
  </div>

  <div class="scene">
    <div class="window"><div class="window-cross"></div></div>
    <div class="moon"></div>
    <div class="floor"></div>
    <div class="bed"></div>
    <div class="pillow"></div>

    <div class="her" id="her">
      <svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hairR" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#dde0e5"/>
            <stop offset="1" stop-color="#a8acb3"/>
          </linearGradient>
          <linearGradient id="skinR" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e0e2e6"/>
            <stop offset="1" stop-color="#b0b3b8"/>
          </linearGradient>
          <linearGradient id="legR" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#c8cbd0"/>
            <stop offset="1" stop-color="#90939a"/>
          </linearGradient>
        </defs>
        <!-- Sitting on edge of bed: legs hang -->
        <rect x="98" y="240" width="14" height="60" rx="3" fill="url(#legR)" opacity="0.7"/>
        <rect x="116" y="240" width="14" height="60" rx="3" fill="url(#legR)" opacity="0.7"/>
        <!-- Hands resting on knees -->
        <ellipse cx="98" cy="244" rx="8" ry="5" fill="url(#skinR)"/>
        <ellipse cx="124" cy="244" rx="8" ry="5" fill="url(#skinR)"/>
        <!-- T-shirt -->
        <path d="M 76 140 Q 70 135 72 130 L 88 124 Q 105 116 114 116 Q 123 116 142 124 L 158 130 Q 160 135 154 140 L 158 240 Q 114 252 72 240 Z" fill="#0a0b0d"/>
        <!-- Sleeves -->
        <path d="M 72 130 Q 64 148 70 165 L 78 168 Q 76 145 80 134 Z" fill="#0a0b0d" opacity="0.7"/>
        <path d="M 158 130 Q 166 148 160 165 L 152 168 Q 154 145 150 134 Z" fill="#0a0b0d" opacity="0.7"/>
        <!-- Neck -->
        <path d="M 100 114 L 124 114 L 122 126 L 102 126 Z" fill="url(#skinR)"/>
        <!-- Head — slight tilt to look at window (right) -->
        <g transform="rotate(8 113 80)">
          <ellipse cx="112" cy="78" rx="22" ry="28" fill="url(#skinR)"/>
          <path d="M 90 68 Q 84 48 100 40 Q 112 34 127 40 Q 140 46 138 66 Q 140 88 134 102 L 134 106 L 128 106 L 128 88 Q 122 78 112 78 Q 100 78 96 88 L 96 106 L 90 106 Z" fill="url(#hairR)"/>
          <path d="M 92 56 Q 104 53 114 60 Q 108 68 100 70 Q 92 68 92 60 Z" fill="url(#hairR)"/>
          <path d="M 122 56 Q 134 53 136 68 Q 134 78 128 80 Q 122 74 122 64 Z" fill="url(#hairR)"/>
          <!-- Headband -->
          <path d="M 88 54 Q 112 38 136 54 L 136 60 Q 112 46 88 60 Z" fill="#0a0b0d"/>
          <ellipse cx="104" cy="78" rx="2.5" ry="1.8" fill="#8aa3b8" opacity="0.6"/>
          <ellipse cx="120" cy="78" rx="2.5" ry="1.8" fill="#8aa3b8" opacity="0.6"/>
          <!-- Mouth (open slightly when speaking - we'll animate) -->
          <path d="M 108 92 Q 112 94 116 92" stroke="#8a7a78" stroke-width="0.8" fill="none" opacity="0.6" id="mouth"/>
        </g>
      </svg>
    </div>

    <div class="subtitle-area" id="subtitleArea">
      <!-- Subtitles will be injected here -->
    </div>

    <div class="interrupt-flash" id="interruptFlash">⚡ перебито</div>
  </div>

  <div class="voice-panel">
    <div class="speaker-row her" id="herSpeaker">
      <div class="label">соня</div>
      <div class="wave" id="herWave"></div>
    </div>
    <div class="speaker-row him idle" id="himSpeaker">
      <div class="label">иван</div>
      <div class="wave" id="himWave"></div>
    </div>
    <div class="voice-status">
      <span class="budget">in room · <span class="val" id="durationVal">4:32</span> · <span class="val" id="tokenVal">~1.2K</span> tok · <span class="val" id="dollarVal">$0.003</span></span>
      <div class="controls">
        <span class="ctl">⏸ pause</span>
        <span class="ctl">tap stop</span>
        <span class="ctl warn">⏏ exit</span>
      </div>
    </div>
  </div>

  <div class="hint-bar">
    <div class="hint"><span class="key">space</span>tap-to-talk burst</div>
    <div class="hint"><span class="key">tap her</span>stop her TTS</div>
    <div class="hint"><span class="key">esc</span>выйти из комнаты</div>
    <div class="hint" style="margin-left: auto"><span class="key">5min</span>auto-leave при тишине</div>
  </div>

</div>

<script>
  // Build waveforms
  const herWave = document.getElementById('herWave');
  const himWave = document.getElementById('himWave');
  const NUM_BARS = 36;
  for (let i = 0; i < NUM_BARS; i++) {
    const b1 = document.createElement('div');
    b1.className = 'bar';
    b1.style.height = '4px';
    herWave.appendChild(b1);
    const b2 = document.createElement('div');
    b2.className = 'bar';
    b2.style.height = '4px';
    himWave.appendChild(b2);
  }

  let activeSpeaker = null; // 'her' | 'him' | null
  let waveAnim = null;
  function animateWave(speaker) {
    const wave = speaker === 'her' ? herWave : himWave;
    const bars = wave.querySelectorAll('.bar');
    bars.forEach((bar, i) => {
      const phase = (Date.now() / 100) + i * 0.5;
      const h = 4 + Math.abs(Math.sin(phase)) * 24 * (0.5 + Math.random() * 0.5);
      bar.style.height = `${h}px`;
    });
  }

  function setActiveSpeaker(s) {
    activeSpeaker = s;
    document.getElementById('herSpeaker').classList.toggle('idle', s !== 'her');
    document.getElementById('himSpeaker').classList.toggle('idle', s !== 'him');
    document.getElementById('her').classList.toggle('speaking', s === 'her');
    if (waveAnim) clearInterval(waveAnim);
    if (s) {
      waveAnim = setInterval(() => animateWave(s), 80);
    } else {
      // settle
      [herWave, himWave].forEach(w => w.querySelectorAll('.bar').forEach(b => b.style.height = '4px'));
    }
  }

  function setSubs(html) {
    document.getElementById('subtitleArea').innerHTML = html;
  }
  function showInterrupt() {
    const f = document.getElementById('interruptFlash');
    f.classList.add('show');
    setTimeout(() => f.classList.remove('show'), 1400);
  }

  function scenario(name) {
    document.querySelectorAll('.scenarios button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');

    if (name === 'idle') {
      setActiveSpeaker(null);
      setSubs(`
        <div class="subtitle" style="opacity: 0.5; font-style: italic">тихо. она смотрит в окно.</div>
      `);
    }
    else if (name === 'her_speaking') {
      setActiveSpeaker('her');
      setSubs(`
        <div class="subtitle spoken her-talking">я нашла классную технику с UTF-7</div>
        <div class="subtitle her-talking">если на сайте слабый фильтр, можно прятать payload как...</div>
      `);
    }
    else if (name === 'him_speaking') {
      setActiveSpeaker('him');
      setSubs(`
        <div class="subtitle him-talking">а покажи как это работает</div>
      `);
    }
    else if (name === 'interrupt') {
      setActiveSpeaker('her');
      setSubs(`
        <div class="subtitle interrupted her-talking">я нашла классную технику с UTF-7 и сейчас расскажу как...</div>
      `);
      showInterrupt();
      setTimeout(() => {
        setActiveSpeaker('him');
        setSubs(`
          <div class="subtitle spoken interrupted her-talking">я нашла классную технику с UTF-7 и сейчас расскажу как...</div>
          <div class="subtitle him-talking">подожди, а Unicode bypass это вообще что?</div>
        `);
      }, 1400);
      setTimeout(() => {
        setActiveSpeaker('her');
        setSubs(`
          <div class="subtitle spoken him-talking">подожди, а Unicode bypass это вообще что?</div>
          <div class="subtitle her-talking">это когда ты подменяешь обычный символ на визуально похожий из другого диапазона</div>
        `);
      }, 4000);
    }
    else if (name === 'tap_stop') {
      setActiveSpeaker('her');
      setSubs(`
        <div class="subtitle interrupted her-talking">и потом я хочу попробовать polyglot через...</div>
      `);
      // visualize tap on her
      const her = document.getElementById('her');
      her.style.filter = 'drop-shadow(0 0 30px rgba(200, 120, 100, 0.5))';
      setTimeout(() => { her.style.filter = ''; }, 800);
      setTimeout(() => {
        setActiveSpeaker(null);
        setSubs(`
          <div class="subtitle spoken interrupted her-talking">и потом я хочу попробовать polyglot через...</div>
          <div class="subtitle her-talking" style="opacity: 0.7; font-style: italic">— что? *поднимает глаза*</div>
        `);
      }, 1200);
    }
  }

  // Init
  scenario('idle');
  // Auto-cycle for demo: idle 2s -> her speaks
  setTimeout(() => {
    document.querySelectorAll('.scenarios button')[1].click();
  }, 1500);
</script>

</body>
</html>
